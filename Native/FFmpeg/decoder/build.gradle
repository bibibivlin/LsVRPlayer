plugins { id 'com.android.library' }
android {
    namespace 'androidx.media3.decoder.ffmpeg'
    compileSdk 35
    defaultConfig { minSdk 29; consumerProguardFiles 'consumer-rules.pro'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; ndk { abiFilters 'arm64-v8a' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.9.3'
    implementation 'androidx.media3:media3-decoder:1.9.3'
    compileOnly 'androidx.annotation:annotation:1.6.0'
    compileOnly 'org.checkerframework:checker-qual:3.49.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
