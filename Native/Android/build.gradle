plugins { id 'com.android.library' version '9.0.0' }
android {
    namespace 'com.linxyi.vrplayer'
    compileSdk 35
    defaultConfig { minSdk 29; consumerProguardFiles 'consumer-rules.pro' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.9.3'
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1'
    implementation 'com.hierynomus:smbj:0.13.0'
    testImplementation 'junit:junit:4.13.2'
}
tasks.register('collectRuntimeDependencies', Copy) {
    from configurations.releaseRuntimeClasspath
    into layout.buildDirectory.dir('runtime-dependencies')
}
