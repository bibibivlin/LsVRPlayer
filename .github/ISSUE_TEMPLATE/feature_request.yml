name: 功能建议
description: 描述希望改进的使用场景
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 当前遇到了什么限制，影响哪种操作或观看需求？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 描述希望如何使用该功能；可以附不含私人信息的示意图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方式或参考（可选）
      description: 现有设置是否能部分解决，或是否有可公开查看的参考？
